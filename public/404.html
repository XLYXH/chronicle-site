<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050506" />
    <title>404 · NODE_NOT_FOUND — IRAS.OS</title>
    <script>
      // GitHub Pages 对任意深度的路径都返回这个文件：算出站点根，保证相对资源可用
      ;(function () {
        var seg = location.pathname.split('/').filter(Boolean)
        var root = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/'
        document.write('<base href="' + root + '">')
      })()
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces-italic.woff2') format('woff2'); font-style: italic; font-weight: 300 500; font-display: swap; }
      @font-face { font-family: 'IBM Plex Mono'; src: url('fonts/plex-mono-400.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Noto Sans SC'; src: url('fonts/noto-sans-sc-subset.woff2') format('woff2'); font-display: swap; }
      :root { --bg: #050506; --fg: #f2f2f0; --dim: #a1a1a8; --line: rgba(255,255,255,.12); --ok: #8dffb8; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg); overflow: hidden;
        font: 400 12px/1.8 'IBM Plex Mono', ui-monospace, 'Noto Sans SC', monospace; letter-spacing: .12em;
        display: grid; grid-template-rows: auto 1fr auto; padding: 28px clamp(20px, 4vw, 56px);
        -webkit-font-smoothing: antialiased;
      }
      body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 50%, #000 0 min(30vw, 34vh), transparent calc(min(30vw, 34vh) + 2px)),
          radial-gradient(circle at 50% 50%, transparent 0 min(29vw, 33vh), rgba(255,255,255,.1) min(33vw, 37vh), transparent min(56vw, 62vh)); }
      body::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
      header, footer { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 16px; color: var(--dim); font-size: 10px; letter-spacing: .18em; }
      header b { color: var(--fg); font-weight: 400; }
      header i { display: inline-block; width: 6px; height: 6px; background: #ffb0b0; margin-right: 8px; }
      main { position: relative; z-index: 1; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; }
      h1 { margin: 0; font: italic 400 clamp(110px, 22vw, 300px)/.9 'Fraunces', serif; letter-spacing: -.04em; text-shadow: 0 0 26px rgba(255,255,255,.35); position: relative; }
      h1 em { color: var(--dim); }
      h1.g { animation: g .3s steps(3) 1; }
      @keyframes g { 0% { transform: translateX(-6px) skewX(-6deg); clip-path: inset(20% 0 40% 0); } 50% { transform: translateX(8px); clip-path: inset(60% 0 5% 0); } 100% { transform: none; clip-path: none; } }
      .lines { color: var(--dim); }
      .lines b { color: var(--fg); font-weight: 400; }
      .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border: 1px solid rgba(255,255,255,.3); letter-spacing: .22em; transition: background-color .3s, color .3s; }
      .btn:hover, .btn:focus-visible { background: var(--fg); color: var(--bg); }
      .caret { animation: c 1s steps(1) infinite; }
      @keyframes c { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { h1.g, .caret { animation: none; } }
    </style>
  </head>
  <body>
    <header><span><i></i><b>SYS.ERROR</b> | IRAS.OS</span><span>ERR_404</span></header>
    <main>
      <p>// NODE_NOT_FOUND</p>
      <h1 id="t">404<em>.</em></h1>
      <p class="lines">&gt; 请求的路径不在索引里<br /><b data-path>/</b> · 已记录，正在返回<span class="caret">_</span></p>
      <a class="btn" href="./">RETURN_HOME ↵</a>
    </main>
    <footer><span>© 2026 CHRONICLE-IRAS</span><a href="https://github.com/Chronicle-IRAS" rel="noopener">NET.GITHUB ↗</a></footer>
    <script>
      document.querySelector('[data-path]').textContent = location.pathname
      var t = document.getElementById('t')
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        setInterval(function () { t.classList.remove('g'); void t.offsetWidth; t.classList.add('g') }, 3200)
      }
    </script>
  </body>
</html>
